name: 'rust'
# Always fires on PRs + master pushes; the `filter` job detects whether
# the diff actually touches Rust sources, and downstream jobs skip
# their expensive steps when it doesn't. This pattern keeps every
# required-check name reporting exactly once per SHA, dodging both
# "skipped but required" (workflow-level `paths:` filter eats the
# check) and the duplicate-status mess of an inverse-twin workflow.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  filter:
    # Outputs `relevant = true|false` — whether the diff touches
    # anything Rust-shaped — and `picker = true|false` — whether it
    # touches anything the picker oracle reads. tools/rust-workflow-
    # filter.sh decides both, and the bats suite runs it over every
    # shape of change it has to tell apart. On push events (merge to
    # master) both are true and the whole pipeline runs.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      picker: ${{ steps.detect.outputs.picker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/rust-workflow-filter.sh "${{ github.event_name }}" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  fmt:
    needs: filter
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --all --check

  clippy:
    needs: filter
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    needs: filter
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: cargo-deny
      - if: needs.filter.outputs.relevant == 'true'
        name: Install cargo-deny
        # Pinning to ^0.18 — older versions choke on RUSTSEC advisories
        # that carry a CVSS v4.0 score (the parser only learned about
        # CVSS 4 in 0.17).
        run: cargo install cargo-deny --locked --version ^0.18
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo deny check
        working-directory: backend
        run: cargo deny check

  test:
    needs: filter
    name: cargo test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install runtime deps (Linux only)
        # The provider transport resolves a curl binary before it can
        # issue a request, and the player / download surfaces probe for
        # mpv, ffmpeg and aria2. The tests that assert on tool argv
        # stage their own stubs; these are here so the paths that look
        # for a real installation find one. `api_play` is gated to
        # `#![cfg(target_os = "linux")]`, so other matrix legs skip it
        # without needing the deps.
        if: needs.filter.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          # Distro sources only: see tests/arch/apt_sources.sh.
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y curl mpv ffmpeg aria2
      - if: needs.filter.outputs.relevant == 'true'
        name: Fetch the crates before the network is refused
        working-directory: backend
        run: cargo fetch --locked
      - if: needs.filter.outputs.relevant == 'true' && runner.os != 'Windows'
        name: Point TMPDIR at a directory a shell reads specially
        # Nearly every path the backend tests stage comes from the
        # temporary directory, and many tests paste one into a stub
        # script or a config file. Under this directory a test that
        # pastes it unquoted fails here, on the pull request that adds
        # it, rather than for whoever first runs the suite with an
        # apostrophe in their TMPDIR. The tool says what the name
        # carries. Windows keeps its own: a double quote cannot be
        # part of a name there, and its tests stage no shell stubs.
        run: |
          dir=$(sh tools/hostile-tmpdir.sh "$RUNNER_TEMP")
          printf 'TMPDIR=%s\n' "$dir" >> "$GITHUB_ENV"
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo test --workspace
        working-directory: backend
        # A RUSTFLAGS environment variable replaces every rustflags
        # entry in .cargo/config.toml rather than merging with it, so
        # the workflow-level '-D warnings' silently discards the
        # static-CRT flag the config pins for MSVC. Windows re-adds
        # it here; the crt-static assertion in app.rs goes red in any
        # environment that loses the flag again.
        #
        # The run is offline. Every outside request goes to a proxy whose
        # name never resolves, while the loopback mocks the tests stand
        # up are reached directly, so a test that reaches a real host
        # fails on every run rather than passing until that host
        # answers differently: an AniList case once passed while
        # graphql.anilist.co answered it and failed the day that host
        # sent a 429 of its own. A name under `.invalid` fails at once
        # on every OS, where a refused loopback port costs Windows a
        # second or two per connection. reqwest (no client opts out of
        # the environment's proxy) and the curl the transport spawns
        # both honour these. So do cargo and rustup: the step before
        # fetched every crate, cargo is told not to look, and the
        # toolchain the run uses was installed before it. The names are
        # lowercase only: an env map's keys are case-insensitive, and
        # every reader here takes the lowercase form — curl reads
        # `http_proxy` in no other — where reqwest reads either.
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          http_proxy: http://proxy.invalid:9
          https_proxy: http://proxy.invalid:9
          all_proxy: http://proxy.invalid:9
          no_proxy: 127.0.0.1,localhost,::1
          CARGO_NET_OFFLINE: 'true'
        run: cargo test --workspace --all-features

  picker-oracle:
    needs: filter
    name: picker oracle agreement
    # The season picker against the model of docs/title-resolution.md
    # under tests/picker-oracle/: every generated pool and every row of
    # the docs' own table must pick as the model says, or be carried by
    # the allowlist with a reason. The recorded fixtures' golden is the
    # ordinary `recorded_fixtures_pick_as_the_golden_dump_records` test
    # the `test` job already runs. The model is standard-library Python,
    # run with the runner's python3.
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.picker != 'true'
        run: 'echo "Not required: no picker, fixture, oracle or title-resolution changes in this PR"'
      - if: needs.filter.outputs.picker == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.picker == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.picker == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: needs.filter.outputs.picker == 'true'
        name: The model's own tests
        run: python3 -I -m unittest discover -s tests/picker-oracle -p 'test_*.py'
      - if: needs.filter.outputs.picker == 'true'
        name: Generate the pools
        run: python3 -I tests/picker-oracle/oracle.py gen "$RUNNER_TEMP/cases.json"
      - if: needs.filter.outputs.picker == 'true'
        name: Run the picker over them
        working-directory: backend
        env:
          PICKER_ORACLE_CASES: ${{ runner.temp }}/cases.json
          PICKER_ORACLE_OUT: ${{ runner.temp }}/out.json
        # The exact test name, and the outcome file has to exist after:
        # a filter that matches no test exits 0 having run nothing.
        run: |
          cargo test --lib -- --ignored --exact commands::play_native_walk::fixture_tests::oracle::run_the_oracle_cases
          test -s "$PICKER_ORACLE_OUT" || {
            echo "run_the_oracle_cases wrote no outcomes to $PICKER_ORACLE_OUT"
            exit 1
          }
      - if: needs.filter.outputs.picker == 'true'
        name: Compare with the model
        run: >
          python3 -I tests/picker-oracle/oracle.py cmp
          "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/out.json"
          --allowlist tests/picker-oracle/allowlist.json

  coverage:
    needs: filter
    name: cargo-llvm-cov + ratchet
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: llvm-cov
      - if: needs.filter.outputs.relevant == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: needs.filter.outputs.relevant == 'true'
        name: Install runtime deps
        # Coverage runs `cargo llvm-cov --workspace`, which executes the
        # same tests as the `test` job — see the matching comment there
        # for what resolves each of these.
        run: |
          # Distro sources only: see tests/arch/apt_sources.sh.
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y curl mpv ffmpeg aria2
      - if: needs.filter.outputs.relevant == 'true'
        name: Fetch the crates and llvm-tools before the network is refused
        working-directory: backend
        # cargo-llvm-cov asks rustup for llvm-tools-preview on the
        # pinned toolchain the first time it runs, and rustup honours
        # the proxy variables the next step sets.
        run: |
          rustup component add llvm-tools-preview
          cargo fetch --locked
      - if: needs.filter.outputs.relevant == 'true'
        name: Generate lcov
        working-directory: backend
        # Offline, as the `test` job's run is; see there.
        env:
          http_proxy: http://proxy.invalid:9
          https_proxy: http://proxy.invalid:9
          all_proxy: http://proxy.invalid:9
          no_proxy: 127.0.0.1,localhost,::1
          CARGO_NET_OFFLINE: 'true'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - if: needs.filter.outputs.relevant == 'true'
        name: Ratchet — fail if coverage drops
        run: node tools/check-coverage-baseline.mjs
      - if: needs.filter.outputs.relevant == 'true'
        name: Upload lcov for downstream CRAP job
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: backend/lcov.info
          retention-days: 7
