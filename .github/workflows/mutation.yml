name: 'mutation testing (informational)'
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-mutants:
    name: cargo-mutants (Rust)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: backend
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Fetch the crates before the network is refused
        working-directory: backend
        run: cargo fetch --locked
      - name: Run cargo-mutants on scoped modules
        working-directory: backend
        # Offline, as rust.yml's `test` job runs; see there.
        env:
          http_proxy: http://proxy.invalid:9
          https_proxy: http://proxy.invalid:9
          all_proxy: http://proxy.invalid:9
          no_proxy: 127.0.0.1,localhost,::1
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo mutants \
            --in-place \
            --no-shuffle \
            --timeout 120 \
            -p ani-gui \
            -f 'src/proxy/**/*.rs' \
            -f 'src/cache/**/*.rs' \
            -f 'src/scraper/**/*.rs' \
            -f 'src/history/**/*.rs' \
            --json > mutants.json
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-report
          path: backend/mutants.json
          retention-days: 30

  stryker:
    name: stryker-js (TS lib only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pnpm install
        uses: ./.github/actions/pnpm-install
        with:
          working-directory: .
          args: --frozen-lockfile --filter ani-gui-frontend
      - name: stryker (lib/ only)
        run: pnpm exec stryker run
      - name: Upload stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: frontend/reports/mutation/
          retention-days: 30
