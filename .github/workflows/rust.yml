name: 'rust'
# Always fires on PRs + master pushes; the `filter` job detects whether
# the diff actually touches Rust sources, and downstream jobs skip
# their expensive steps when it doesn't. This pattern keeps every
# required-check name reporting exactly once per SHA, dodging both
# "skipped but required" (workflow-level `paths:` filter eats the
# check) and the duplicate-status mess of an inverse-twin workflow.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  filter:
    # Outputs `relevant = true|false` based on whether the PR diff
    # touches anything Rust-shaped. On push events (merge to master)
    # we always run the real pipeline.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      picker: ${{ steps.detect.outputs.picker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "picker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Capture the diff first, then grep the result via a here-string.
          # The naive `git diff | grep -q` pipeline interacts badly with
          # pipefail: grep -q closes the pipe on first match and `git diff`
          # gets killed by SIGPIPE, the pipeline exits non-zero, and the
          # if-condition wrongly takes the else branch on relevant PRs.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # The picker golden is an input of the test job: the recorded
          # fixtures are compared against it.
          if grep -qE '^(backend/|tests/fixtures/|rust-toolchain\.toml$|tests/picker-oracle/fixtures-golden\.json$|\.github/workflows/rust\.yml$)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
          # The picker oracle reads the picker, its recorded pools, its
          # own model and the document the model transcribes: a change to
          # any of them is a question for it, while a change to the docs
          # alone is no reason to run the rest of this pipeline.
          if grep -qE '^(backend/|tests/fixtures/hianime/picker/|tests/picker-oracle/|docs/title-resolution\.md$|\.github/workflows/rust\.yml$)' <<<"$changed"; then
            echo "picker=true" >> "$GITHUB_OUTPUT"
          else
            echo "picker=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    needs: filter
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --all --check

  clippy:
    needs: filter
    name: cargo clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    needs: filter
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: cargo-deny
      - if: needs.filter.outputs.relevant == 'true'
        name: Install cargo-deny
        # Pinning to ^0.18 — older versions choke on RUSTSEC advisories
        # that carry a CVSS v4.0 score (the parser only learned about
        # CVSS 4 in 0.17).
        run: cargo install cargo-deny --locked --version ^0.18
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo deny check
        working-directory: backend
        run: cargo deny check

  test:
    needs: filter
    name: cargo test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install runtime deps (Linux only)
        # The provider transport resolves a curl binary before it can
        # issue a request, and the player / download surfaces probe for
        # mpv, ffmpeg and aria2. The tests that assert on tool argv
        # stage their own stubs; these are here so the paths that look
        # for a real installation find one. `api_play` is gated to
        # `#![cfg(target_os = "linux")]`, so other matrix legs skip it
        # without needing the deps.
        if: needs.filter.outputs.relevant == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mpv ffmpeg aria2
      - if: needs.filter.outputs.relevant == 'true'
        name: cargo test --workspace
        working-directory: backend
        # A RUSTFLAGS environment variable replaces every rustflags
        # entry in .cargo/config.toml rather than merging with it, so
        # the workflow-level '-D warnings' silently discards the
        # static-CRT flag the config pins for MSVC. Windows re-adds
        # it here; the crt-static assertion in app.rs goes red in any
        # environment that loses the flag again.
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo test --workspace --all-features

  picker-oracle:
    needs: filter
    name: picker oracle agreement
    # The season picker against the model of docs/title-resolution.md
    # under tests/picker-oracle/: every generated pool and every row of
    # the docs' own table must pick as the model says, or be carried by
    # the allowlist with a reason. The recorded fixtures' golden is the
    # ordinary `recorded_fixtures_pick_as_the_golden_dump_records` test
    # the `test` job already runs. The model is standard-library Python,
    # run with the runner's python3.
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.picker != 'true'
        run: 'echo "Not required: no picker, fixture, oracle or title-resolution changes in this PR"'
      - if: needs.filter.outputs.picker == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.picker == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.picker == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - if: needs.filter.outputs.picker == 'true'
        name: The model's own tests
        run: python3 -I -m unittest discover -s tests/picker-oracle -p 'test_*.py'
      - if: needs.filter.outputs.picker == 'true'
        name: Generate the pools
        run: python3 -I tests/picker-oracle/oracle.py gen "$RUNNER_TEMP/cases.json"
      - if: needs.filter.outputs.picker == 'true'
        name: Run the picker over them
        working-directory: backend
        env:
          PICKER_ORACLE_CASES: ${{ runner.temp }}/cases.json
          PICKER_ORACLE_OUT: ${{ runner.temp }}/out.json
        # The exact test name, and the outcome file has to exist after:
        # a filter that matches no test exits 0 having run nothing.
        run: |
          cargo test --lib -- --ignored --exact commands::play_native_walk::fixture_tests::oracle::run_the_oracle_cases
          test -s "$PICKER_ORACLE_OUT" || {
            echo "run_the_oracle_cases wrote no outcomes to $PICKER_ORACLE_OUT"
            exit 1
          }
      - if: needs.filter.outputs.picker == 'true'
        name: Compare with the model
        run: >
          python3 -I tests/picker-oracle/oracle.py cmp
          "$RUNNER_TEMP/cases.json" "$RUNNER_TEMP/out.json"
          --allowlist tests/picker-oracle/allowlist.json

  coverage:
    needs: filter
    name: cargo-llvm-cov + ratchet
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no Rust changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: llvm-cov
      - if: needs.filter.outputs.relevant == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: needs.filter.outputs.relevant == 'true'
        name: Install runtime deps
        # Coverage runs `cargo llvm-cov --workspace`, which executes the
        # same tests as the `test` job — see the matching comment there
        # for what resolves each of these.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl mpv ffmpeg aria2
      - if: needs.filter.outputs.relevant == 'true'
        name: Generate lcov
        working-directory: backend
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - if: needs.filter.outputs.relevant == 'true'
        name: Ratchet — fail if coverage drops
        run: node tools/check-coverage-baseline.mjs
      - if: needs.filter.outputs.relevant == 'true'
        name: Upload lcov for downstream CRAP job
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: backend/lcov.info
          retention-days: 7
