name: 'required-check mirrors (zero-diff safe)'
# Reports required-check names unconditionally, so no combination of
# path filters can leave branch protection waiting on a status that
# never arrives (see PR #23 for the original symptom, a zero-diff
# ancestry merge that matched no filter anywhere).
#
# The mirrors used to shadow upstream-vendored workflows this fork
# could not edit. Those workflows retired with the vendored script;
# what remains here is the reporter for each required name until the
# name itself leaves branch protection — that half lives in the
# repository settings, which only the maintainer can edit. The
# markdown pair (markdown.yml / inverse-md.yml) is still real and
# path-gated, so its two names keep genuine mirrors; the script's
# names are stubs, and this file shrinks to the markdown mirrors in
# the same change that trims the required list.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # The subject — the vendored script's executable bit — is gone;
  # the required name still needs a reporter.
  exec-bit:
    name: Executable Bit
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Not required: the vendored script this checked is gone"'

  # Was the sh-dialect pass on the vendored script; what it scans
  # now is the repo's remaining POSIX shell outside tests/ and gui/
  # (the tools/ scripts), which keeps the required name earning its
  # report rather than stubbing it.
  shellcheck-shfmt:
    name: Shellcheck + Shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the sh-checker
        uses: luizm/action-sh-checker@master
        env:
          SHELLCHECK_OPTS: -s sh -o all -e 2250
          SHFMT_OPTS: -i 4 -ci -d
        with:
          sh_checker_exclude: "tests gui"

  # Mirrors markdown.yml::trailing-ws.
  trailing-ws:
    name: Find Trailing Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocular-d/trailing-spaces@0.0.2

  # Mirrors markdown.yml::dead-links. Scans every **.md in the
  # repo every run; the file count is small and the action is
  # fast, so we don't bother filtering. On PRs that did touch
  # **.md, upstream's workflow also fires and runs the same scan.
  dead-links:
    name: Dead Link Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DeadFinder
        uses: hahwul/deadfinder@1.2.4
        with:
          command: file
          target: "**.md"

  # The script's version-bump pair never fired anywhere (its filter
  # carried a typo that matched nothing); this stub was always what
  # branch protection actually saw, and it stays until the name
  # leaves the required list.
  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Not required: the vendored script this versioned is gone"'
