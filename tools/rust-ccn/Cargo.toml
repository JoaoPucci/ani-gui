[package]
name = "rust-ccn"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Per-function cyclomatic complexity for the CRAP gate, measured on syn's parse of each file"
license = "GPL-3.0"
publish = false

[dependencies]
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.117", default-features = false, features = ["full", "visit", "parsing", "printing"] }

[dev-dependencies]
proptest = "1.5"
