name: 'bash tests'
# Always fires; the `filter` job decides whether downstream steps run
# the real pipeline or no-op. See rust.yml for the design rationale.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # See rust.yml's filter for why we avoid `git diff | grep -q`
          # under pipefail (SIGPIPE on early grep exit kills the diff).
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          # `tests/tools/` carries scripts the bats suites execute
          # (the snapshot generator); a change there must run the
          # suite that runs them. Workflows are included because the
          # invocation harness pins their resolved shape against the
          # recorded snapshot.
          if grep -qE '^(tests/bash/|tests/arch/|tests/tools/|tests/fixtures/|\.gitignore$|\.github/workflows/[^/]+\.ya?ml$)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: filter
    name: Shellcheck + Shfmt (per-file dialect)
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no bash test changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        name: Install shellcheck + shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # shfmt is not in 24.04 apt; install the static binary.
          sudo curl -sSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
      - if: needs.filter.outputs.relevant == 'true'
        name: shfmt (all test sources)
        run: |
          # The formatter settings the repo has always applied to its
          # test sources. .bats-vendor/ is gitignored and absent in CI
          # checkouts.
          find tests/bash tests/arch -type f \
            \( -name '*.bats' -o -name '*.bash' -o -name '*.sh' \) \
            -print0 | xargs -0 shfmt -i 4 -ci -d
      - if: needs.filter.outputs.relevant == 'true'
        name: shellcheck (sh dialect for *.sh helpers)
        run: |
          # POSIX-sh helpers and arch checks, under `-s sh -o all
          # -e 2250` plus:
          #   SC2034 — variables set for a consumer the linter can't see
          #   SC2086 — intentional word-splitting on $files for shfmt batches
          #   SC2312 — `-o all` enables a check that flags every command
          #            substitution; too noisy for scripts where $() is
          #            the natural idiom
          find tests/bash/helpers tests/arch -type f -name '*.sh' \
            -print0 | xargs -0 shellcheck -s sh -o all -e 2250 -e SC2034 -e SC2086 -e SC2312
      - if: needs.filter.outputs.relevant == 'true'
        name: shellcheck (bash dialect for *.bash helpers and *.bats files)
        run: |
          # bats files run under bash. Disabled checks (test-context noise):
          #   SC2034 — vars set for a sourced consumer the linter can't see
          #   SC2086 — intentional word-splitting on batched filename lists
          #   SC2154 — referenced-but-not-assigned (set in loader.bash)
          #   SC2317 — "unreachable" function defs bats invokes by name
          #   SC2030/2031 — bats runs each @test in a subshell; export
          #            scoping is intentional (per-test-only)
          #   SC2163 — dynamic `export -f "$cmd"` in process_stub: $cmd
          #            holds a function name, this is the intended use
          #   SC2181 — `$?` after a captured assignment is required when
          #            the command was inside $(...) substitution
          #   SC2016 — single-quoted `bash -c '...'` bodies: we deliberately
          #            avoid host expansion so $ANI_CLI_PATH resolves in
          #            the inner shell after sourcing the loader
          find tests/bash -type f \( -name '*.bats' -o -name '*.bash' \) \
            ! -path '*/.bats-vendor/*' \
            -print0 | xargs -0 shellcheck -s bash \
              -e SC2034 -e SC2086 -e SC2154 -e SC2317 \
              -e SC2030 -e SC2031 -e SC2163 -e SC2181 -e SC2016

  bats:
    needs: filter
    name: bats-core suite
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no bash test changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4
      - if: needs.filter.outputs.relevant == 'true'
        name: Install bash test dependencies
        run: |
          sudo apt-get update
          # The invocation harness runs the workflow-snapshot
          # projection, which reads the workflows through PyYAML.
          sudo apt-get install -y python3-yaml
      - if: needs.filter.outputs.relevant == 'true'
        name: Install bats-core and plugins
        run: ./tests/bash/helpers/install-bats.sh
      - if: needs.filter.outputs.relevant == 'true'
        name: Run bats suites — gating
        run: ./tests/bash/helpers/run-suite.sh
