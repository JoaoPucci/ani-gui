# Reports the required check name `No Awk Allowed` unconditionally.
#
# The check's subject — the vendored ani-cli script and upstream's
# grep over it — left the repository with the script. The name is
# still in branch protection's required list, so a reporter has to
# exist or every pull request blocks waiting on a status that never
# arrives. This stub is that reporter, and nothing more.
#
# Delete this file in the same change that removes `No Awk Allowed`
# from the required checks — that half lives in the repository
# settings, which only the maintainer can edit.

name: 'no awk (required)'
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check-no-awk:
    name: No Awk Allowed
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Not required: the vendored script this check read is gone"'
