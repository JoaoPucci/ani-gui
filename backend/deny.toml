# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
yanked = "deny"
# Unmaintained-advisory acknowledgements live here as ignores when CI
# flags "this crate is no longer maintained" notices for transitive
# deps. Each entry is by advisory id, so a vulnerability advisory filed
# against the same crate later still fails the check.
ignore = [
    # chrono is unmaintained (informational, no vulnerability, no patched
    # version). It is not our dependency: m3u8-rs, the HLS manifest
    # parser/rewriter behind the stream proxy, requires it unconditionally
    # (features = ["std"]) to parse and re-serialize the RFC 3339 dates in
    # EXT-X-PROGRAM-DATE-TIME and EXT-X-DATERANGE. Every m3u8-rs release
    # since 5.0, 6.0.1 (the latest) included, depends on it, so no version
    # bump or feature flag removes it; only replacing the parser would. Remove this entry
    # when m3u8-rs moves off chrono (to jiff or time, the advisory's
    # recommended alternatives), or when the proxy stops using m3u8-rs.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; pulled in only by m3u8-rs, whose releases since 5.0, the latest included, require it" },
]

[licenses]
# Our crate is GPL-3.0 (inherited from ani-cli). Everything else we link
# against is permissive — list those here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "GPL-3.0",
    # webpki-roots ships under CDLA-Permissive-2.0 (Community Data License
    # Agreement, permissive). It is a recognized SPDX-id permissive license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
