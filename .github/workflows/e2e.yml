name: 'e2e (Playwright + Electron)'
# Runs the Electron e2e harness in `electron/e2e/`. Self-contained:
# rebuilds the Rust backend, the SvelteKit bundle, and the unpacked
# Electron app, then drives the packaged binary via `_electron.launch()`
# under Xvfb.
#
# Two packages, one per job, built in parallel:
#
#   - `e2e` drives the e2e package (`pnpm run package:e2e`): the
#     release's Linux package except that its backend is built with the
#     `test-run-key` feature, so a test run's flags file signed by the
#     fixture test-run key can turn a flag on, and every flag runs in
#     each state (electron/e2e/flags/). It is an unpacked tree in
#     dist-e2e/ whose backend comes from backend/target-e2e/, which no
#     release configuration reads (electron/lib/e2e-package.cjs).
#   - `release-package` builds the package the release scripts build
#     (`pnpm run dist`) and checks the backend it carries: statically
#     linked, and holding no test-run key.
#   - `release-backend-windows` builds the Windows backend with the
#     script a Windows release runs (`pnpm run build:backend`) and
#     checks it holds no test-run key. The Windows installer is not
#     built in CI.
#
# Always fires; the `filter` job decides whether downstream steps run
# the real pipeline or no-op. See rust.yml for the design rationale.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # See tools/rust-workflow-filter.sh for why we avoid `git diff | grep -q`
          # under pipefail (SIGPIPE on early grep exit kills the diff).
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if grep -qE '^(backend/|frontend/|electron/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.github/workflows/e2e\.yml$|\.github/actions/(apt|pnpm)-install/)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: filter
    name: Playwright + _electron
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no backend / frontend / electron changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4

      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        name: Rust musl target for the pinned toolchain
        # The Linux packages carry a backend linked statically against
        # musl, so it runs on systems older than the runner. The target
        # goes on the toolchain rust-toolchain.toml pins, which cargo
        # uses here; the action above installs targets only for the
        # toolchain it selects.
        run: rustup target add x86_64-unknown-linux-musl
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: backend -> target-e2e
          shared-key: e2e-test-run

      - if: needs.filter.outputs.relevant == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: needs.filter.outputs.relevant == 'true'
        name: Linux deps for Electron + Xvfb
        # Electron's chrome process needs the standard NSS / X / GTK
        # bundle even in headless Xvfb mode. `xvfb-run` is the wrapper
        # we invoke playwright through. The list mirrors what the
        # AppImage runtime expects on a clean runner. `dbus-daemon`
        # gives keyring-unresponsive.spec.ts a session bus of its own,
        # with a secret service that never answers; `libsecret-1-0` is
        # what Chromium loads to ask it, and without it safeStorage
        # falls back to basic_text and never asks.
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            musl-tools
            xvfb
            dbus-daemon
            libsecret-1-0
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0
            libcairo2 libasound2t64

      - if: needs.filter.outputs.relevant == 'true'
        name: pnpm install (workspace)
        uses: ./.github/actions/pnpm-install
        with:
          working-directory: .
          args: --frozen-lockfile

      - if: needs.filter.outputs.relevant == 'true'
        name: Electron build and launch helpers (node --test)
        # The helpers under electron/lib — dependency staging, the
        # AppImage tree's permissions, the launch decisions — run at
        # build or launch time, where nothing else would catch them.
        working-directory: electron
        run: pnpm test

      - if: needs.filter.outputs.relevant == 'true'
        name: Package the e2e app (test-run backend, produces dist-e2e/linux-unpacked/)
        working-directory: electron
        run: pnpm run package:e2e

      - if: needs.filter.outputs.relevant == 'true'
        name: The e2e package's backend trusts the test-run key
        # The flags specs turn a flag on with a file signed by the
        # fixture test-run key, which only a backend built with the
        # `test-run-key` feature trusts. Found here, it also shows the
        # release-shaped job's search for the same key can find it.
        working-directory: electron
        run: |
          set -euo pipefail
          backend=dist-e2e/linux-unpacked/resources/ani-gui-backend
          test -f "$backend"
          key=$(head -n 1 ../backend/tests/fixtures/flags-signature/test-run-key.pub)
          test -n "$key"
          grep -qaF -- "$key" "$backend"

      - if: needs.filter.outputs.relevant == 'true'
        name: Run Playwright tests under Xvfb
        working-directory: electron
        run: xvfb-run --auto-servernum pnpm run e2e:fast

      - if: failure() && needs.filter.outputs.relevant == 'true'
        name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: electron/playwright-report/
          retention-days: 14

  release-package:
    needs: filter
    name: release-shaped package
    runs-on: ubuntu-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no backend / frontend / electron changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4

      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        name: Rust musl target for the pinned toolchain
        # See the e2e job: the target goes on the toolchain
        # rust-toolchain.toml pins.
        run: rustup target add x86_64-unknown-linux-musl
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: backend
          shared-key: e2e

      - if: needs.filter.outputs.relevant == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: needs.filter.outputs.relevant == 'true'
        name: Linux deps for the static backend
        uses: ./.github/actions/apt-install
        with:
          packages: musl-tools

      - if: needs.filter.outputs.relevant == 'true'
        name: pnpm install (workspace)
        uses: ./.github/actions/pnpm-install
        with:
          working-directory: .
          args: --frozen-lockfile

      - if: needs.filter.outputs.relevant == 'true'
        name: Package the Electron app as a release does (produces dist/linux-unpacked/)
        # `dist` builds the backend with the release's own script
        # (`build:backend:linux`), then the AppImage, as
        # `dist:release` does with the .deb besides.
        working-directory: electron
        run: pnpm run dist

      - if: needs.filter.outputs.relevant == 'true'
        name: The packaged backend needs no system C library
        # A backend linked against the runner's glibc would refuse to
        # start on any system with an older one. The musl build is a
        # static-pie binary: it keeps a dynamic section to relocate
        # itself, but names no shared library and no loader.
        working-directory: electron
        run: |
          set -euo pipefail
          backend=dist/linux-unpacked/resources/ani-gui-backend
          test -f "$backend"
          kind=$(file -b "$backend")
          echo "$kind"
          case "$kind" in
            *"static-pie linked"* | *"statically linked"*) ;;
            *)
              echo "the packaged backend is not statically linked" >&2
              exit 1
              ;;
          esac
          dynamic=$(readelf -d "$backend")
          if grep -q NEEDED <<<"$dynamic"; then
            grep NEEDED <<<"$dynamic"
            echo "the packaged backend needs shared libraries" >&2
            exit 1
          fi

      - if: needs.filter.outputs.relevant == 'true'
        name: The release-shaped backend trusts no test-run key
        # A backend built with its `test-run-key` feature trusts a test
        # run's flags file under a fixture key whose secret anyone can
        # derive (backend/tests/fixtures/flags-signature/), and declares
        # the probe flag the e2e suite drives. The package here is built
        # by the scripts a release uses, so neither may be in it. The e2e
        # job finds the same key in its own package, so this search is
        # one that can find it. tests/arch/test_run_key.sh holds the
        # scripts to that on both platforms; this checks the binary they
        # made on Linux, and release-backend-windows the one on Windows.
        working-directory: electron
        run: |
          set -euo pipefail
          backend=dist/linux-unpacked/resources/ani-gui-backend
          test -f "$backend"
          key=$(head -n 1 ../backend/tests/fixtures/flags-signature/test-run-key.pub)
          test -n "$key"
          if grep -qaF -- "$key" "$backend"; then
            echo "the packaged backend carries the test-run key" >&2
            exit 1
          fi
          if grep -qaF -- test_run_probe "$backend"; then
            echo "the packaged backend declares the test-run probe" >&2
            exit 1
          fi

  release-backend-windows:
    needs: filter
    name: release-shaped backend (Windows)
    runs-on: windows-latest
    steps:
      - if: needs.filter.outputs.relevant != 'true'
        run: 'echo "Not required: no backend / frontend / electron changes in this PR"'
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4

      - if: needs.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          workspaces: backend
          shared-key: e2e-windows-release

      - if: needs.filter.outputs.relevant == 'true'
        uses: pnpm/action-setup@v4
      - if: needs.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: needs.filter.outputs.relevant == 'true'
        name: Build the backend as a Windows release does
        # `build:backend` is the script `package:win` runs before the
        # installer is made: a release build, no features, with the
        # static C runtime backend/.cargo/config.toml sets for MSVC.
        # The installer itself is not built here.
        working-directory: electron
        run: pnpm run build:backend

      - if: needs.filter.outputs.relevant == 'true'
        name: The Windows release backend trusts no test-run key
        # As the release-shaped job checks the Linux backend: no
        # fixture test-run key and no probe flag, which only a build
        # with the `test-run-key` feature has. The e2e job finds the
        # same key in its own backend, so the search is one that can
        # find it.
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          backend=../backend/target/release/ani-gui-backend.exe
          test -f "$backend"
          key=$(head -n 1 ../backend/tests/fixtures/flags-signature/test-run-key.pub | tr -d '\r')
          test -n "$key"
          if grep -qaF -- "$key" "$backend"; then
            echo "the Windows release backend carries the test-run key" >&2
            exit 1
          fi
          if grep -qaF -- test_run_probe "$backend"; then
            echo "the Windows release backend declares the test-run probe" >&2
            exit 1
          fi
