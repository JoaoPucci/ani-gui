name: 'architectural invariants'
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: tests/arch + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the parser the resolution layer stands on
        # deferral_root_test.sh certifies the resolved workflow
        # structure through PyYAML; without it the suite refuses
        # rather than certifies, so the dependency is provisioned
        # here and pinned by the suite itself.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/actionlint
      - name: actionlint (workflow syntax)
        run: actionlint
      # The divergence check compares the vendored ani-cli against
      # upstream and skips silently when no `upstream` remote exists —
      # which, on a bare checkout, was always. It has therefore never
      # run in CI, and neither would anything asserting on it.
      #
      # Pinned to the tag the vendored script came from, not to
      # upstream's moving master. Against a moving baseline the count
      # changes when upstream commits, so CI could go red on a branch
      # that touched nothing — a failure with no local cause is worse
      # than no check. Bumping the pin is part of syncing the script.
      - name: Configure the upstream divergence baseline
        run: |
          git remote add upstream https://github.com/pystardust/ani-cli.git
          git fetch --depth=1 upstream tag v4.15 --no-tags
      - name: Run architectural invariants
        run: bash tests/arch/run-all.sh
